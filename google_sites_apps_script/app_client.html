<script>
(function () {
  "use strict";

  const STAGE_NAMES = {
    0: "Problem Identification",
    1: "Requirement Engineering",
    2: "System Design",
    3: "Implementation",
    4: "Testing & Validation"
  };

  const THEME_INFO = {
    1: { id: 1, name: "Data Storage and Retrieval Systems", full: "Theme 1: Data Storage and Retrieval Systems", desc: "Specialized systems for indexing, caching, storage engines, and persistent query retrieval." },
    2: { id: 2, name: "Data Processing and Analytics Systems", full: "Theme 2: Data Processing and Analytics Systems", desc: "Real-time telemetry, log processing, data profiling, streaming, and metric transformation pipelines." },
    3: { id: 3, name: "System Software and Development Tools", full: "Theme 3: System Software and Development Tools", desc: "System utilities, runtime profilers, execution monitors, memory diagnostic tools, and compiler tooling." },
    4: { id: 4, name: "Networked Systems and Tools", full: "Theme 4: Networked Systems and Tools", desc: "Network topologies, protocol routers, distributed coordination, remote procedure utilities, and communication." },
    5: { id: 5, name: "Algorithmic and Optimization Systems", full: "Theme 5: Algorithmic and Optimization Systems", desc: "Constraint satisfaction engines, resource allocation algorithms, routing heuristics, and combinatorial solvers." },
    6: { id: 6, name: "Concurrent and Transactional Systems", full: "Theme 6: Concurrent and Transactional Systems", desc: "Transaction atomicity, concurrent lock managers, mutual exclusion models, distributed ledgers, and consensus." }
  };

  const ROLE_PAGES = {
    "Team Lead": ["portfolio", "edit", "overview", "mentor", "evidence", "discussion", "register"],
    "Faculty": ["review", "portfolio", "overview", "mentor", "evidence", "discussion"],
    "Faculty Admin": ["allocation", "department", "overview", "portfolio"],
    "HOD": ["department", "portfolio", "overview"],
    "Admin": ["admin", "department", "allocation", "overview", "portfolio"]
  };

  const NAV_META = {
    overview: { label: "Overview", icon: "grid" },
    department: { label: "Department & Themes", icon: "layers" },
    portfolio: { label: "Portfolio Display", icon: "book" },
    edit: { label: "Edit Portfolio (0–4)", icon: "compass" },
    journey: { label: "Edit Portfolio (0–4)", icon: "compass" },
    review: { label: "Faculty Review Queue", icon: "check" },
    allocation: { label: "Guide Allocation", icon: "users" },
    mentor: { label: "AI Mentor Studio", icon: "sparkles" },
    evidence: { label: "Evidence Library", icon: "folder" },
    discussion: { label: "Discussions", icon: "chat" },
    register: { label: "Register Project", icon: "plus" },
    admin: { label: "Admin & Roster", icon: "shield" }
  };

  const ICONS = {
    grid: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
    layers: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    book: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    compass: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
    check: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    users: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    sparkles: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>',
    folder: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
    chat: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    plus: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>',
    shield: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'
  };

  function loadSavedSession() {
    try {
      const raw = typeof sessionStorage !== "undefined" ? sessionStorage.getItem("pg_auth_session") : null;
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  const _savedSess = loadSavedSession();

  window.APP = {
    authenticated: Boolean(_savedSess),
    session: _savedSess,
    loginRole: (_savedSess && _savedSess.role) || "Team Lead",
    loginError: "",
    role: (_savedSess && _savedSess.role) || "HOD",
    page: (_savedSess && _savedSess.landingPage) || "department",
    bootstrap: null,
    overview: null,
    selectedProjectId: "",
    selectedStudentUsn: (_savedSess && _savedSess.usn) || "",
    selectedFacultyId: (_savedSess && _savedSess.facultyId) || "",
    activeThemeId: 0, // 0 = All themes
    activePortfolioStage: 0,
    activeJourneyStage: 0,
    searchQuery: "",
    stageFilter: "ALL",
    evidenceFilter: "ALL",
    mentorSplitOpen: false,
    sidebarCollapsed: false,
    themeMode: localStorage.getItem("pg_theme") || "light",
    lightboxZoom: 1,
    pendingRosterImport: []
  };

  function esc(val) {
    return String(val === undefined || val === null ? "" : val)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  window.esc = esc;

  function toast(msg, isErr) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.style.background = isErr ? "#9f1239" : "var(--navy, #0f172a)";
    el.style.display = "block";
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 3800);
  }
  window.toast = toast;

  function callServer(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      if (typeof google === "undefined" || !google.script || !google.script.run) {
        return reject(new Error("Apps Script runtime unavailable."));
      }
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))));
      runner[fnName].apply(runner, args);
    });
  }
  window.callServer = callServer;

  function setBusy(busy, label) {
    const el = document.getElementById("topbar-sync-status");
    if (!el) return;
    el.innerHTML = busy
      ? '<span class="loading-overlay">⏳ ' + esc(label || "Syncing with Google Sheets...") + "</span>"
      : '<span class="gas-badge-cloud">● Connected to Sheets & Drive</span>';
  }

  function applyTheme(mode) {
    APP.themeMode = mode === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", APP.themeMode);
    localStorage.setItem("pg_theme", APP.themeMode);
    const btn = document.getElementById("theme-toggle-btn");
    if (btn) btn.textContent = APP.themeMode === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
  }

  window.toggleTheme = function () {
    applyTheme(APP.themeMode === "dark" ? "light" : "dark");
  };

  window.toggleSidebar = function () {
    APP.sidebarCollapsed = !APP.sidebarCollapsed;
    const shell = document.getElementById("app-shell");
    if (shell) shell.classList.toggle("sidebar-collapsed", APP.sidebarCollapsed);
  };

  function getProjects() {
    return (APP.overview && APP.overview.projects) ? APP.overview.projects : [];
  }
  window.getAllProjects = getProjects;

  function getCurrentProject() {
    const list = getProjects();
    if (!list.length) return null;
    if (APP.selectedProjectId) {
      const hit = list.find(p => String(p.project_id) === String(APP.selectedProjectId) ||
        (p.team && String(p.team.team_id) === String(APP.selectedProjectId)));
      if (hit) return hit;
    }
    if (APP.role === "Team Lead" && APP.selectedStudentUsn) {
      const hit = list.find(p => (p.members || []).some(m => String(m.usn).toUpperCase() === APP.selectedStudentUsn));
      if (hit) return hit;
    }
    if (APP.role === "Faculty" && APP.selectedFacultyId) {
      const hit = list.find(p => p.faculty && String(p.faculty.faculty_id) === String(APP.selectedFacultyId));
      if (hit) return hit;
    }
    return list[0];
  }
  function getOwnedStudentProject() {
    const list = getProjects();
    if (!APP.selectedStudentUsn) return null;
    const usnUpper = String(APP.selectedStudentUsn).trim().toUpperCase();
    return list.find(p => (p.members || []).some(m => String(m.usn || "").trim().toUpperCase() === usnUpper)) || null;
  }

  function canEditProject(proj) {
    if (!proj || APP.role !== "Team Lead") return false;
    const usnUpper = String(APP.selectedStudentUsn || "").trim().toUpperCase();
    if (!usnUpper) return false;
    return (proj.members || []).some(m => String(m.usn || "").trim().toUpperCase() === usnUpper);
  }

  window.getCurrentProject = getCurrentProject;

  function getProjectThemeId(proj) {
    const topic = (proj.team && proj.team.topic) || proj.technologies || proj.abstract || "";
    const m = String(topic).match(/Theme\s*(\d)/i);
    if (m) return Number(m[1]);
    const low = String(topic).toLowerCase();
    if (/storage|retrieval|rdbms|key-value|search engine|metadata/.test(low)) return 1;
    if (/processing|analytics|log|profiling|integration|event/.test(low)) return 2;
    if (/kernel|compiler|build|system software/.test(low)) return 3;
    if (/network|peer|router|socket|dns|telemetry|coordination/.test(low)) return 4;
    if (/algorithm|optimization|solver|routing|scheduler|allocation/.test(low)) return 5;
    if (/concurrent|transactional|lock|consensus|ledger|atomic/.test(low)) return 6;
    return 1;
  }

  function getStageObj(proj, num) {
    return (proj.stages || []).find(s => Number(s.stage_number) === Number(num)) ||
      { stage_number: num, status: num === 0 ? "Draft" : "Locked", fields: {} };
  }

  function statusTagClass(status) {
    const s = String(status || "").toLowerCase();
    if (s.includes("approved") || s.includes("completed")) return "green";
    if (s.includes("submitted")) return "amber";
    if (s.includes("revision")) return "red";
    if (s.includes("locked")) return "gray";
    return "blue";
  }

  function resolveDiagramUrl(src, proj) {
    if (!src) return "";
    const s = String(src).trim();
    if (/^(https?:|data:)/i.test(s)) return s;
    const base = s.split("/").pop().toLowerCase();
    if (proj && proj.documents) {
      const doc = proj.documents.find(d => String(d.file_name || "").toLowerCase() === base && (d.thumbnail_url || d.drive_url));
      if (doc) return doc.thumbnail_url || doc.drive_url;
    }
    const assetMapJson = APP.overview && APP.overview.settings && APP.overview.settings.asset_map_json;
    if (assetMapJson) {
      try {
        const map = JSON.parse(assetMapJson);
        if (map[s]) return map[s];
        if (map[base]) return map[base];
      } catch (e) {}
    }
    return "";
  }

  function renderDiagramBox(rawSrc, caption, proj) {
    const url = resolveDiagramUrl(rawSrc, proj);
    if (!url && !rawSrc) return "";
    if (url) {
      return `
        <div class="diagram-frame" style="margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center">
          <img src="${esc(url)}" alt="${esc(caption || "Diagram")}"
            style="max-width:100%;max-height:430px;height:auto;border-radius:8px;display:block;margin:0 auto;cursor:zoom-in"
            onclick="openLightbox('${esc(url)}', '${esc(caption || "")}')">
          ${caption ? `<p class="diagram-caption" style="margin-top:10px;font-size:12.5px;font-weight:700;color:#0f172a">${esc(caption)}</p>` : ""}
        </div>`;
    }
    const fname = String(rawSrc).split("/").pop();
    return `
      <div class="diagram-frame" style="margin-top:14px;background:var(--surface-2,#f8fafc);border:1px dashed var(--line-strong,#cbd5e1);border-radius:12px;padding:18px;text-align:center">
        <div style="font-size:1.4rem;margin-bottom:6px">🖼️</div>
        <strong style="display:block;font-size:.95rem;color:var(--ink)">${esc(caption || "Architecture / Workflow Diagram")}</strong>
        <p class="muted" style="margin:6px 0 0;font-size:.82rem">Asset reference: <code>${esc(fname)}</code> — Upload via <b>Evidence Library</b> or run <code>upload_drive_assets.py</code> to display live preview from Google Drive.</p>
      </div>`;
  }

  // Lightbox
  window.openLightbox = function (src, caption) {
    APP.lightboxZoom = 1;
    const lb = document.getElementById("diagram-lightbox");
    const img = document.getElementById("lightbox-img");
    const cap = document.getElementById("lightbox-caption");
    if (!lb || !img) return;
    img.src = src;
    img.style.transform = "scale(1)";
    if (cap) cap.textContent = caption || "";
    lb.classList.add("open");
  };
  window.closeLightbox = function () {
    const lb = document.getElementById("diagram-lightbox");
    if (lb) lb.classList.remove("open");
  };
  window.zoomLightbox = function (delta) {
    APP.lightboxZoom = delta === 0 ? 1 : Math.min(2.6, Math.max(0.6, APP.lightboxZoom + delta));
    const img = document.getElementById("lightbox-img");
    if (img) img.style.transform = "scale(" + APP.lightboxZoom + ")";
  };

  function applyInitialRoute() {
    const r = window.INITIAL_ROUTE || {};
    if (r.theme) {
      APP.activeThemeId = Number(r.theme) || 0;
    }
    if (r.team || r.project) {
      const target = String(r.team || r.project).toLowerCase();
      const hit = getProjects().find(p =>
        String(p.project_id).toLowerCase() === target ||
        (p.team && String(p.team.team_id).toLowerCase() === target)
      );
      if (hit) APP.selectedProjectId = hit.project_id;
    }
    if (r.page) {
      const pMap = {
        department: "department", hod: "department",
        student: "edit", journey: "edit", edit: "edit",
        faculty: "review", review: "review",
        portfolio: "portfolio", project: "portfolio",
        mentor: "mentor",
        admin: "admin", allocation: "allocation",
        overview: "overview", evidence: "evidence", discussion: "discussion"
      };
      if (pMap[r.page]) {
        const mapped = pMap[r.page];
        const allowed = ROLE_PAGES[APP.role] || ["portfolio"];
        APP.page = allowed.includes(mapped) ? mapped : allowed[0];
      }
    }
  }

  async function refreshAll(silent) {
    setBusy(true, "Loading live Google Sheets data...");
    try {
      const [boot, ov] = await Promise.all([
        callServer("getAppBootstrap"),
        callServer("getDepartmentOverview").catch(() => null)
      ]);
      APP.bootstrap = boot;
      APP.overview = ov;
      if (!APP.selectedStudentUsn && boot && boot.studentsList && boot.studentsList.length) {
        const t3 = boot.studentsList.find(s => String(s.usn).includes("01FE24BCI029"));
        APP.selectedStudentUsn = t3 ? t3.usn : boot.studentsList[0].usn;
      }
      if (!APP.selectedFacultyId && boot && boot.facultyList && boot.facultyList.length) {
        APP.selectedFacultyId = boot.facultyList[0].faculty_id;
      }
      if (!APP.selectedProjectId && ov && ov.projects && ov.projects.length) {
        const a03 = ov.projects.find(p => p.team && p.team.team_id === "A-03");
        APP.selectedProjectId = a03 ? a03.project_id : ov.projects[0].project_id;
      }
      if (!silent) applyInitialRoute();
      renderApp();
    } catch (e) {
      toast(e.message, true);
      renderSetupFallback(e.message);
    } finally {
      setBusy(false);
    }
  }
  window.refreshAll = refreshAll;

  function renderSetupFallback(errMsg) {
    const loginEl = document.getElementById("login-screen");
    const rootEl = document.getElementById("workspace-split-root");
    const fallbackHtml = `
      <div class="card" style="max-width:720px;margin:24px auto;padding:24px">
        <h2 style="margin-bottom:8px">Database Setup Required</h2>
        <p class="muted" style="margin-bottom:14px">${esc(errMsg || "Spreadsheet connection is not initialized yet.")}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn primary" onclick="runOneClickSetup()">Run setupProjectGate() &amp; Seed 31-Team Cohort</button>
        </div>
      </div>`;
    if (!APP.authenticated && loginEl) {
      loginEl.style.display = "flex";
      if (rootEl) rootEl.style.display = "none";
      loginEl.innerHTML = fallbackHtml;
    } else {
      const view = document.getElementById("main-view");
      if (view) view.innerHTML = fallbackHtml;
    }
  }

  function renderLoginScreen() {
    const loginEl = document.getElementById("login-screen");
    if (!loginEl) return;
    const boot = APP.bootstrap || {};
    const counts = boot.counts || { teams: 31, students: 119, faculty: 15 };
    const role = APP.loginRole || "Team Lead";
    const facultyList = boot.facultyList || [];
    const studentsList = boot.studentsList || [];
    const sampleStudents = studentsList.filter(s => ["01FE24BCI029", "01FE24BCI044", "01FE24BCI120"].includes(String(s.usn).toUpperCase()));
    const quickStudents = sampleStudents.length ? sampleStudents : studentsList.slice(0, 3);

    let roleFields = "";
    if (role === "Team Lead") {
      roleFields = `
        <div class="field">
          <label for="login-identifier">Username (Student USN)</label>
          <input id="login-identifier" type="text" placeholder="e.g. 01FE24BCI029" autocomplete="username">
        </div>
        <div class="field">
          <label for="login-passcode">Password (Student USN)</label>
          <input id="login-passcode" type="password" placeholder="Enter your USN as password" autocomplete="current-password">
          <small class="muted" style="font-size:.74rem">Sign in with your assigned USN as both Username and Password.</small>
        </div>
        ${quickStudents.length ? `
          <div>
            <span class="muted" style="font-size:.76rem">Quick-fill sample student USN:</span>
            <div class="login-quick-chips">
              ${quickStudents.map(s => `<button type="button" class="login-chip" onclick="quickFillLogin('Team Lead','${esc(s.usn)}','${esc(s.usn)}')">${esc(s.usn)} · ${esc(s.full_name)}</button>`).join("")}
            </div>
          </div>` : ""}`;
    } else if (role === "Faculty") {
      const firstFac = facultyList[0] ? facultyList[0].faculty_id : "FAC-09";
      roleFields = `
        <div class="field">
          <label for="login-identifier">Username (Faculty ID or Email)</label>
          <select id="login-identifier">
            ${facultyList.length
              ? facultyList.map(f => `<option value="${esc(f.faculty_id)}">${esc(f.full_name)} (${esc(f.faculty_id)})</option>`).join("")
              : '<option value="FAC-09">Mr. Amit Kachavimath (FAC-09)</option>'}
          </select>
        </div>
        <div class="field">
          <label for="login-passcode">Password (Faculty ID)</label>
          <input id="login-passcode" type="password" placeholder="e.g. ${esc(firstFac)}" autocomplete="current-password">
          <small class="muted" style="font-size:.74rem">Default password is your Faculty ID (e.g. <code>${esc(firstFac)}</code>).</small>
        </div>`;
    } else {
      const defHint = role === "HOD" ? "HOD2026" : (role === "Faculty Admin" ? "FADMIN2026" : "ADMIN2026");
      roleFields = `
        <div class="field">
          <label for="login-identifier">Username / Department ID</label>
          <input id="login-identifier" type="text" placeholder="e.g. ${esc(role)}" autocomplete="username">
        </div>
        <div class="field">
          <label for="login-passcode">Password</label>
          <input id="login-passcode" type="password" placeholder="Enter ${esc(role)} password" autocomplete="current-password">
          <small class="muted" style="font-size:.74rem">Default passcode: <code>${defHint}</code> (customizable in Admin Settings).</small>
        </div>`;
    }

    loginEl.innerHTML = `
      <div class="login-shell">
        <div class="login-hero-panel">
          <div>
            <span class="tag blue" style="background:rgba(255,255,255,.16);color:#fff;border:none">CS (AI) Mini-Project Portal</span>
            <h1>ProjectGate AI</h1>
            <p style="color:rgba(248,250,252,.85);font-size:.94rem;line-height:1.55;margin:0">
              Sign in required. Access your team's design journey, portfolio showcase, Drive evidence vault, and grounded AI mentoring directly from Google Sheets.
            </p>
          </div>
          <div class="login-metrics-mini">
            <div class="login-metric-box"><strong>${counts.teams || 31}</strong><span>Teams (6 Themes)</span></div>
            <div class="login-metric-box"><strong>${counts.students || 119}</strong><span>Students</span></div>
            <div class="login-metric-box"><strong>${counts.faculty || 15}</strong><span>Faculty Guides</span></div>
          </div>
          <div style="font-size:.78rem;color:rgba(248,250,252,.72)">
            ${boot.initialized ? "● Connected to Master Google Sheet" : "⚠ Master Google Sheet not yet initialized — click Seed below."}
          </div>
        </div>

        <form class="login-form-panel" onsubmit="event.preventDefault();submitLoginForm()">
          <div>
            <h2 style="margin:0 0 4px">Sign In to ProjectGate AI</h2>
            <p class="muted" style="margin:0;font-size:.86rem">Authentication is required before accessing portfolios or editing stages.</p>
          </div>

          <div>
            <label style="display:block;font-size:.78rem;font-weight:700;margin-bottom:6px;color:var(--ink-muted)">Account Role</label>
            <div class="login-role-tabs">
              ${["Team Lead", "Faculty", "HOD", "Faculty Admin", "Admin"].map(r => `
                <button type="button" class="login-role-tab ${role === r ? "active" : ""}" onclick="setLoginRole('${r}')">${esc(r)}</button>
              `).join("")}
            </div>
          </div>

          ${APP.loginError ? `<div class="login-error-banner">${esc(APP.loginError)}</div>` : ""}
          ${roleFields}

          <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
            <button type="submit" id="login-submit-btn" class="btn primary" style="width:100%;justify-content:center;padding:11px">Sign In as ${esc(role)} →</button>

    if (idEl) idEl.value = identifier;

  function activateSession(sess) {
    APP.authenticated = true;
    APP.session = sess;
    APP.loginError = "";
    APP.role = sess.role || "HOD";
    if (sess.usn) {
      APP.selectedStudentUsn = sess.usn;
      const ownProj = getProjects().find(p => (p.members || []).some(m => String(m.usn).toUpperCase() === String(sess.usn).toUpperCase()));
      if (ownProj) APP.selectedProjectId = ownProj.project_id;
    }
    if (sess.facultyId) {
      APP.selectedFacultyId = sess.facultyId;
      const facProj = getProjects().find(p => p.faculty && String(p.faculty.faculty_id) === String(sess.facultyId));
      if (facProj) APP.selectedProjectId = facProj.project_id;
    }
    APP.page = sess.landingPage || (ROLE_PAGES[APP.role] ? ROLE_PAGES[APP.role][0] : "overview");

    // Preserve initial URL deep-link once on first login within user's allowed pages
    const r = window.INITIAL_ROUTE || {};
    if (!window._pgRouteApplied && (r.team || r.project || r.page)) {
      applyInitialRoute();
      window._pgRouteApplied = true;
    }

    try {
      if (typeof sessionStorage !== "undefined") {
        sessionStorage.setItem("pg_auth_session", JSON.stringify(sess));
      }
    } catch (e) {}
    renderApp();
    if (typeof window.loadAiMentorSettingsFromSheets === "function") {
      window.loadAiMentorSettingsFromSheets();
    }
  }

  window.submitLoginForm = async function () {
    const btn = document.getElementById("login-submit-btn");
    const identifier = (document.getElementById("login-identifier")?.value || "").trim();
    const passcode = (document.getElementById("login-passcode")?.value || "").trim();
    APP.loginError = "";
    if (btn) { btn.disabled = true; btn.textContent = "Verifying credentials..."; }
    try {
      const res = await callServer("authenticateUser", {
        role: APP.loginRole,
        identifier: identifier,
        passcode: passcode
      });
      if (!res || !res.success || !res.session) {
        throw new Error((res && res.message) || "Authentication failed.");
      }
      toast("Signed in as " + res.session.displayName + " (" + res.session.role + ")");
      activateSession(res.session);
    } catch (e) {
      APP.loginError = e.message;
      renderLoginScreen();
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "Sign In as " + APP.loginRole + " →"; }
    }
  };

  window.logoutUser = function () {
    APP.authenticated = false;
    APP.session = null;
    APP.mentorSplitOpen = false;
    APP.loginError = "";
    try {
      if (typeof sessionStorage !== "undefined") sessionStorage.removeItem("pg_auth_session");

    renderApp();

  window.jumpToSection = function (elId, stageOverride) {
    if (stageOverride !== undefined && Number(stageOverride) !== APP.activePortfolioStage) {
      APP.activePortfolioStage = Number(stageOverride);
      renderApp();
    }
    setTimeout(() => {
      const el = document.getElementById(elId);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("rag-target-pulse");
        setTimeout(() => el.classList.remove("rag-target-pulse"), 2200);
      }

  window.downloadPortfolioJson = async function (pid) {
    setBusy(true, "Preparing portfolio export...");
    try {
      const payload = await callServer("getProjectPortfolioExport", pid);
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "portfolio_" + pid + ".json";
      a.click();
      toast("Downloaded portfolio JSON.");
    } catch (e) {
      toast(e.message, true);
    } finally {
      setBusy(false);
    }
  };

  function renderJourneyPage() {
    const proj = APP.role === "Team Lead" ? (getOwnedStudentProject() || getCurrentProject()) : null;

  function renderTableBuilder(key, title, cols, rows, readOnly) {
    const arr = Array.isArray(rows) ? rows : [];
    const safeJson = esc(JSON.stringify(arr));
    return `
      <div class="stage-table-editor" data-table-key="${esc(key)}" data-cols="${esc(JSON.stringify(cols))}">
        <div class="stage-table-editor-head">
          <strong>${esc(title)} (${arr.length})</strong>
          ${!readOnly ? `<button type="button" class="btn secondary" style="padding:4px 10px;font-size:.8rem" onclick="addBuilderRow(this)">+ Add Row</button>` : ""}
        </div>
        <div class="table-builder-rows">
          ${arr.map(r => renderBuilderRowHtml(cols, r, readOnly)).join("")}
        </div>
        <input type="hidden" name="json_${esc(key)}" value="${safeJson}">
      </div>`;
  }

  function renderBuilderRowHtml(cols, rowObj, readOnly) {
    const grid = cols.map(() => "1fr").join(" ") + (readOnly ? "" : " 40px");
    return `
      <div class="stage-table-row" style="grid-template-columns:${grid}">
        ${cols.map(c => `<input type="text" data-col="${esc(c.k)}" placeholder="${esc(c.label)}" value="${esc((rowObj && rowObj[c.k]) || "")}" ${readOnly ? "disabled" : ""}>`).join("")}
        ${!readOnly ? `<button type="button" class="btn secondary" style="padding:6px 8px" onclick="this.parentElement.remove()">✕</button>` : ""}
      </div>`;
  }

  window.addBuilderRow = function (btn) {
    const box = btn.closest(".stage-table-editor");
    const cols = JSON.parse(box.getAttribute("data-cols") || "[]");
    const holder = box.querySelector(".table-builder-rows");
    const tmp = document.createElement("div");
    tmp.innerHTML = renderBuilderRowHtml(cols, {}, false);
    holder.appendChild(tmp.firstElementChild);
  };

  function collectBuilderData(form) {
    const out = {};
    form.querySelectorAll(".stage-table-editor").forEach(box => {
      const key = box.getAttribute("data-table-key");
      const rows = [];
      box.querySelectorAll(".stage-table-row").forEach(rowEl => {
        const obj = {};
        let hasAny = false;
        rowEl.querySelectorAll("input[data-col]").forEach(inp => {
          const val = inp.value.trim();
          obj[inp.getAttribute("data-col")] = val;
          if (val) hasAny = true;
        });
        if (hasAny) rows.push(obj);
      });
      out[key] = rows;
    });
    return out;
  }

  window.uploadStageImage = function (inputEl, projectId, stageNum, targetInputName) {
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function () {
      const base64 = String(reader.result || "").split(",")[1];
      setBusy(true, "Uploading diagram to Google Drive...");
      try {
        const res = await callServer("uploadDocument", {
          usn: APP.selectedStudentUsn,
          project_id: projectId,
          file_name: file.name,
          mime_type: file.type,
          base64: base64,
          document_type: "IMAGE",
          stage: stageNum,
          caption: targetInputName
        });
        const form = document.getElementById("journey-stage-form");
        const target = form && form.querySelector('[name="' + targetInputName + '"]');
        if (target) target.value = res.thumbnail_url || res.drive_url;
        toast("Diagram uploaded to Drive! Click Save Draft to persist link.");
      } catch (e) {
        toast(e.message, true);
      } finally {
        setBusy(false);
      }
    };
    reader.readAsDataURL(file);
  };

  window.saveJourneyStage = async function (stageNum, submit) {
    const proj = getOwnedStudentProject() || getCurrentProject();
    const form = document.getElementById("journey-stage-form");
    if (!proj || !form || !canEditProject(proj)) return;

    const fields = collectBuilderData(form);
    form.querySelectorAll("input[name], textarea[name]").forEach(el => {
      const name = el.getAttribute("name");
      if (name.startsWith("json_")) return;
      if (["objectives", "architecturePoints", "dataDesignPoints", "algorithmDesignPoints", "securityDesignPoints"].includes(name)) {
        fields[name] = el.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      } else {
        fields[name] = el.value.trim();
      }
    });

    setBusy(true, submit ? "Submitting Stage " + stageNum + "..." : "Saving Stage " + stageNum + " draft...");
    try {
      const res = await callServer("saveStageSubmission", {
        usn: APP.selectedStudentUsn,
        project_id: proj.project_id,
        stage_number: stageNum,
        submit: submit,
        fields: fields
      });
      toast(res.message);
      await refreshAll(true);
    } catch (e) {
      toast(e.message, true);
    } finally {
      setBusy(false);
    }
  };

    const b = APP.bootstrap || {};
    const c = b.counts || {};
    return `
      <div class="card" style="margin-bottom:16px">
        <h2>Admin Console &amp; Google Sheets Database</h2>
        <p class="muted">Students: <b>${c.students || 0}</b> • Teams: <b>${c.teams || 0}</b> • Projects: <b>${c.projects || 0}</b> • Faculty: <b>${c.faculty || 0}</b></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
          <button class="btn primary" onclick="runOneClickSetup()">Populate 31-Team Cohort (SeedCohort)</button>
          <button class="btn secondary" onclick="exportCohortWorkbook()">Export Workbook (.xlsx)</button>
          ${b.spreadsheetUrl ? `<a class="btn secondary" target="_blank" href="${esc(b.spreadsheetUrl)}">Open Master Sheet ↗</a>` : ""}
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <input id="admin-sheet-url" placeholder="Paste Google Sheet URL or ID to switch database..." style="flex:1;min-width:260px;padding:8px 10px;border:1px solid var(--line);border-radius:8px">
          <button class="btn secondary" onclick="connectSheet()">Connect Sheet</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h3>Atomic Excel / CSV Roster Import (SheetJS)</h3>
        <p class="muted">Upload a spreadsheet (<code>.xlsx</code>, <code>.xls</code>, <code>.csv</code>) with columns: <code>Team ID</code>, <code>Name</code>, <code>USN</code>, <code>Theme</code>, <code>Guide</code>.</p>
        <input type="file" accept=".xlsx,.xls,.csv" onchange="parseExcelFile(this)" style="margin:8px 0">
        <div id="excel-preview-box">
          ${APP.pendingRosterImport.length ? `
            <p style="margin:8px 0"><b>${APP.pendingRosterImport.length}</b> roster rows staged for atomic import.</p>
            <button class="btn primary" onclick="commitExcelRoster()">Commit ${APP.pendingRosterImport.length} Rows to Google Sheets</button>` : ""}
        </div>
      </div>

      <div class="grid three">
        <div class="card">
          <h4>Add Student</h4>
          <div class="field"><label>USN</label><input id="add-stu-usn" placeholder="01FE24BCI099"></div>
          <div class="field"><label>Full Name</label><input id="add-stu-name"></div>
          <button class="btn primary" onclick="quickAddStudent()">Add Student</button>
        </div>
        <div class="card">
          <h4>Add Faculty</h4>
          <div class="field"><label>Name</label><input id="add-fac-name"></div>
          <div class="field"><label>Email</label><input id="add-fac-email"></div>
          <button class="btn primary" onclick="quickAddFaculty()">Add Faculty</button>
        </div>
        <div class="card">
          <h4>Department &amp; Login Passcodes</h4>
          <div class="field"><label>Department Name</label><input id="set-dept" value="${esc((APP.overview && APP.overview.department) || "CS (AI)")}"></div>
          <div class="field"><label>Academic Year</label><input id="set-year" value="${esc((APP.overview && APP.overview.academicYear) || "2026-27")}"></div>
          <div class="field"><label>HOD Passcode</label><input id="set-hod-pass" placeholder="Default: HOD2026" value="${esc((APP.overview && APP.overview.settings && APP.overview.settings.hod_passcode) || "")}"></div>
          <div class="field"><label>Admin Passcode</label><input id="set-admin-pass" placeholder="Default: ADMIN2026" value="${esc((APP.overview && APP.overview.settings && APP.overview.settings.admin_passcode) || "")}"></div>
          <hr style="border:none;border-top:1px solid var(--line);margin:10px 0">
          <h4 style="margin:6px 0">Workspace Gemini AI Settings (Sheets)</h4>
          <div class="field"><label>Default Gemini Model</label>
            <select id="set-gemini-model">
              ${((APP.overview && APP.overview.geminiModels) || (APP.bootstrap && APP.bootstrap.geminiModels) || [
                { id: "gemini-3.8-flash", label: "Gemini 3.8 Flash (Recommended)" },
                { id: "gemini-2.5-flash", label: "Gemini 2.5 Flash" },
                { id: "gemini-2.5-pro", label: "Gemini 2.5 Pro" },
                { id: "gemini-2.0-flash", label: "Gemini 2.0 Flash" },
                { id: "gemini-2.0-flash-lite", label: "Gemini 2.0 Flash-Lite" }
              ]).map(m => `<option value="${esc(m.id)}" ${((APP.overview && APP.overview.settings && APP.overview.settings.gemini_model) || "gemini-3.8-flash") === m.id ? "selected" : ""}>${esc(m.label)}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Workspace Gemini API Key</label>
            <input id="set-gemini-key" type="password" placeholder="${(APP.overview && APP.overview.settings && APP.overview.settings.gemini_key_masked) ? "Saved in Sheets: " + esc(APP.overview.settings.gemini_key_masked) : "Paste AIza... to save in Sheets"}" autocomplete="off">
          </div>
          <button class="btn primary" onclick="saveDeptSettings()">Save Settings to Sheets</button>
        </div>
      </div>`;
  }

  window.connectSheet = async function () {
    const val = document.getElementById("admin-sheet-url")?.value.trim();
    if (!val) return toast("Paste a Google Sheet URL or ID.", true);
    setBusy(true, "Connecting sheet...");
    try {
      const res = await callServer("connectExistingSheet", val);
      toast(res.message);
      await refreshAll(true);
    } catch (e) {
      toast(e.message, true);
    } finally {
      setBusy(false);
    }
  };

  window.parseExcelFile = function (input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (typeof XLSX === "undefined") return toast("SheetJS library not loaded.", true);
    const reader = new FileReader();
    reader.onload = function (ev) {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        let lastTid = "", lastTheme = "", lastGuide = "";
        APP.pendingRosterImport = raw.map(r => {
          const norm = {};
          Object.keys(r).forEach(k => { norm[k.trim().toLowerCase().replace(/[^a-z0-9]/g, "")] = String(r[k]).trim(); });
          const tid = norm.teamid || norm.team || lastTid;
          if (tid) lastTid = tid;
          const theme = norm.theme || norm.topic || lastTheme;
          if (theme) lastTheme = theme;
          const guide = norm.guide || norm.facultyguide || norm.mentor || lastGuide;
          if (guide) lastGuide = guide;
          return {
            teamId: tid,
            usn: (norm.usn || "").toUpperCase(),
            name: norm.name || norm.fullname || norm.studentname || "",
            theme: theme,
            guide: guide,
            title: norm.title || norm.projecttitle || ""
          };
        }).filter(r => r.usn && r.name && r.teamId);
        toast("Parsed " + APP.pendingRosterImport.length + " student rows.");
        renderApp();
      } catch (e) {
        toast("Excel parse error: " + e.message, true);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  window.commitExcelRoster = async function () {
    if (!APP.pendingRosterImport.length) return;
    setBusy(true, "Committing roster atomically to Google Sheets...");
    try {
      const res = await callServer("adminImportRosterRows", { rows: APP.pendingRosterImport });
      APP.pendingRosterImport = [];
      toast(res.message);
      await refreshAll(true);
    } catch (e) {
      toast(e.message, true);
    } finally {
      setBusy(false);
    }
  };

  window.exportCohortWorkbook = function () {
    if (typeof XLSX === "undefined") return exportDepartmentCsv();
    const rows = getProjects().map(p => ({
      "Team ID": p.team ? p.team.team_id : p.owner_id,
      "Theme": "Theme " + getProjectThemeId(p),
      "Project Title": p.project_title,
      "Faculty Mentor": p.faculty ? p.faculty.full_name : "",
      "Members": (p.members || []).map(m => m.full_name + " (" + m.usn + ")").join(", "),
      "Status": p.status
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ProjectGate_Cohort");
    XLSX.writeFile(wb, "projectgate_cohort.xlsx");
    toast("Exported projectgate_cohort.xlsx");
  };

  window.quickAddStudent = async function () {
    setBusy(true, "Adding student...");
    try {
      const res = await callServer("adminAddStudent", {
        usn: document.getElementById("add-stu-usn")?.value,
        full_name: document.getElementById("add-stu-name")?.value
      });
      toast(res.message);
      await refreshAll(true);
    } catch (e) { toast(e.message, true); } finally { setBusy(false); }
  };

  window.quickAddFaculty = async function () {
    setBusy(true, "Adding faculty...");
    try {
      const res = await callServer("adminAddFaculty", {
        full_name: document.getElementById("add-fac-name")?.value,
        email: document.getElementById("add-fac-email")?.value
      });
      toast(res.message);
      await refreshAll(true);
    } catch (e) { toast(e.message, true); } finally { setBusy(false); }
  };

  window.saveDeptSettings = async function () {
    setBusy(true, "Saving settings...");
    try {
      const payload = {
        department_name: document.getElementById("set-dept")?.value,
        academic_year: document.getElementById("set-year")?.value
      };
      const hodPass = document.getElementById("set-hod-pass")?.value.trim();
      const adminPass = document.getElementById("set-admin-pass")?.value.trim();
      const geminiModel = document.getElementById("set-gemini-model")?.value;
      const geminiKey = document.getElementById("set-gemini-key")?.value.trim();
      if (hodPass) payload.hod_passcode = hodPass;
      if (adminPass) payload.admin_passcode = adminPass;
      if (geminiModel) payload.gemini_model = geminiModel;
      if (geminiKey) payload.gemini_api_key = geminiKey;
      const res = await callServer("adminSaveDepartmentSettings", payload);
      toast(res.message);
      await refreshAll(true);
      if (typeof window.loadAiMentorSettingsFromSheets === "function") window.loadAiMentorSettingsFromSheets();
    } catch (e) { toast(e.message, true); } finally { setBusy(false); }
  };

  function renderMain() {
    const view = document.getElementById("main-view");
    if (!view) return;
    if (APP.page === "department") view.innerHTML = renderDepartmentPage();
    else if (APP.page === "portfolio") view.innerHTML = renderPortfolioPage();
    else if (APP.page === "edit" || APP.page === "journey") view.innerHTML = renderJourneyPage();
    else if (APP.page === "review") view.innerHTML = renderFacultyPage();
    else if (APP.page === "allocation") view.innerHTML = renderAllocationPage();
    else if (APP.page === "evidence") view.innerHTML = renderEvidencePage();
    else if (APP.page === "discussion") view.innerHTML = renderDiscussionPage();
    else if (APP.page === "register") view.innerHTML = renderRegisterPage();
    else if (APP.page === "admin") view.innerHTML = renderAdminPage();
    else if (APP.page === "mentor" && typeof window.renderMentorStudioPage === "function") {
      view.innerHTML = window.renderMentorStudioPage();
    } else {
      view.innerHTML = renderOverviewPage();
    }
  }

  function renderApp() {
    const loginEl = document.getElementById("login-screen");
    const rootEl = document.getElementById("workspace-split-root");
    const ragEl = document.getElementById("rag-floating-root");

    if (!APP.authenticated) {
      if (loginEl) loginEl.style.display = "flex";
      if (rootEl) rootEl.style.display = "none";
      if (ragEl) ragEl.style.display = "none";
      renderLoginScreen();
      return;
    }

    if (loginEl) loginEl.style.display = "none";
    if (rootEl) rootEl.style.display = APP.mentorSplitOpen ? "grid" : "block";
    if (ragEl) ragEl.style.display = "block";

    renderSidebar();
    renderTopbar();
    renderMain();
    if (typeof window.syncMentorSplitPane === "function") window.syncMentorSplitPane();
    if (typeof window.syncRagFabState === "function") window.syncRagFabState();
  }
  window.renderApp = renderApp;

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") window.closeLightbox();
  });

  document.addEventListener("DOMContentLoaded", function () {
    applyTheme(APP.themeMode);
    refreshAll(false);
  });
})();
</script>
